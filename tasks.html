<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Saver</title>
    <link rel="stylesheet" href="tasks.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="make-sure">
        <p>Are you sure you want to delete this task?</p>
        <button id="confirm-delete">Yes</button>
        <button id="cancel-delete">No</button>
    </div>

    <div class="overlay">
        <form class="edit">
            <p>✖</p>
            <div class="inputs">
                <input type="text" name="title-edit" id="" placeholder="Title edit">
                <textarea name="description-edit" id="" rows="10" placeholder="Description edit"></textarea>
            </div>
            <div class="btn-area">
                <button type="submit">Edit</button>
            </div>
        </form>
    </div>


    <header>
        <div class="top">
            <h1 class="head-title">Task Saver.</h1>
            <a href="" id="redirect">Home Page</a>
        </div>
        <div class="line"></div>
    </header>

    <main>
        <!--
//                                        TASK SAVER
// | SIDE BAR     | (search by date)(search by letter)           (In progress) (Completed)   |
// | title        |  1. Saturday Food - Rememeber to cook the sat...  (edit) (done) (delete) |                                                                  |
// | desc         |  2. Saturday Food - Rememeber to cook the sat...  (edit) (done) (delete) |                                                                     |
// | Add button   |  ....                                                                    |
        // Save to local storage
        // Ask to make sure before deleting a task -->

        <aside>
            <form class="input-field">
                <h1>Add a new task</h1>
                <div class="inputs">
                    <label for="">Task Title</label>
                    <input type="text" name="title" id="" placeholder="Task Title">
                </div>
                <div class="inputs">
                    <label for="">Task Description</label>
                    <textarea name="description" id="" rows="10" placeholder="Task Description"></textarea>
                </div>
                <div class="btn-area">
                    <button type="submit">Add Task</button>
                </div>
            </form>
        </aside>



        <section class="tasks-section">
            <div class="top-section">
                <div class="searchbars">
                    <input type="text" name="" id="" placeholder="Search by Date">
                    <input type="text" name="search-by-letter" id="" placeholder="Search by Title">
                </div>
                <div class="filters">
                    <p>In Progress</p>
                    <p>Completed</p>
                </div>
            </div>
            <div class="tasks-container">
                <!-- <div class="tasks">
                    <div class="index">
                        <p>1</p>
                    </div>
                    <div class="middle">
                        <p>Title</p>
                        <div class="line"></div>
                        <p>Description </p>
                    </div>
                    <div class="action-icons">
                        <input type="checkbox" name="done" id="">
                        <span>🖋</span>
                        <span>❌</span>
                    </div>
                </div> -->
            </div>
        </section>
    </main>
</body>
<script src="tasks.js"></script>

</html>

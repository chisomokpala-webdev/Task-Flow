<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your tasks with TaskFlow. Add, edit, complete, and organize your daily to-do list in one simple app.">
    <meta name="keywords" content="task manager, task app, to do list, task tracker, daily planner, productivity tool">
    <meta name="theme-color" content="#4299e1">
    <meta property="og:title" content="TaskFlow | Manage Your Tasks">
    <meta property="og:description" content="Create, edit, complete, and track tasks with a lightweight task management app built for productivity.">
    <meta property="og:type" content="website">
    <title>TaskFlow | Manage Your Tasks</title>
    <link rel="stylesheet" href="tasks.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- =========================
         Modal and overlay windows
         ========================= -->
    <div class="make-sure">
        <p>Are you sure you want to delete this task?</p>
        <button id="confirm-delete">Yes</button>
        <button id="cancel-delete">No</button>
    </div>

    <div class="overlay">
        <form class="edit">
            <p>✖</p>
            <div class="inputs">
                <input type="text" name="title-edit" id="" placeholder="Title edit">
                <textarea name="description-edit" id="" rows="10" placeholder="Description edit"></textarea>
            </div>
            <div class="btn-area">
                <button type="submit">Edit</button>
            </div>
        </form>
    </div>

    <dialog id="myModal">
        <p id="modalmessage"></p>
        <button>Ok, Got it!</button>
    </dialog>

    <!-- End of modal and overlay section -->

    <!-- =========================
         App header navigation
         ========================= -->
    <header>
        <div class="top">
            <h1 class="head-title">TaskFlow</h1>
            <a href="" id="redirect">Home Page</a>
        </div>
        <div class="line"></div>
    </header>

    <main>
        <!--
            Task layout plan:
            - left: add task form
            - right: task list with filter controls
            - data persists with localStorage
            - delete action asks for confirmation before removing the task
        -->

        <aside>
            <form class="input-field">
                <h1>Add a new task</h1>
                <div class="inputs">
                    <label for="">Task Title</label>
                    <input type="text" name="title" id="" placeholder="Task Title">
                </div>
                <div class="inputs">
                    <label for="">Task Description</label>
                    <textarea name="desc" id="" rows="10" placeholder="Task Description"></textarea>
                </div>
                <div class="btn-area">
                    <button type="submit">Add Task</button>
                </div>
            </form>
        </aside>



        <section class="tasks-section">
            <div class="top-section">
                <!-- Task filters for active and completed views -->
                <div class="filters">
                    <p class="filter-item">
                        <span class="filter-label">Active</span>
                        <span id="task-count-active" class="task-count-badge">0</span>
                    </p>
                    <p class="filter-item">
                        <span class="filter-label">Completed</span>
                        <span id="task-count-completed" class="task-count-badge">0</span>
                    </p>
                </div>
            </div>
            <div class="tasks-container">
                <!-- <div class="tasks">
                    <div class="index">
                        <p>1</p>
                    </div>
                    <div class="middle">
                        <p>Title</p>
                        <div class="line"></div>
                        <p>Description </p>
                    </div>
                    <div class="action-icons">
                        <input type="checkbox" name="done" id="">
                        <span>🖋</span>
                        <span>❌</span>
                    </div>
                </div> -->
            </div>
        </section>
    </main>
</body>
<script src="tasks.js"></script>

</html>
